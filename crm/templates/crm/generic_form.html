{% extends 'crm/base.html' %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ form_title }}</h1></div>
<div class="card" style="max-width:640px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div style="color:#b8261a;font-size:0.8rem;margin-top:4px;">{{ field.errors|striptags }}</div>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
