{% extends 'crm/base.html' %}
{% block title %}Delete{% endblock %}
{% block content %}
<div class="page-header"><h1>Delete {{ object }}?</h1></div>
<div class="card" style="max-width:520px;">
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
